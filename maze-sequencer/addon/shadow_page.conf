knob cx=120 cy=228 r=30 label="CORRUPT" key=s1_corrupt min=0 max=100 pct=0
knob cx=320 cy=228 r=30 label="CV RANGE" key=s1_cv_range min=0 max=100 pct=20
knob cx=520 cy=228 r=30 label="LENGTH" key=s1_length min=1 max=8 pct=100
knob cx=720 cy=228 r=30 label="CHANNEL" key=s1_channel min=0 max=15 pct=0
