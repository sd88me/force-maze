# force-maze (Maze Sequencer) shadow-mode page -- mirrors the web GUI's panel
# (web/index.html): same Sequencer A/B + Global split, same Maze Voice palette
# (force-shadow's default theme). int_values=1: maze_seq_host parses every SET
# with atoi(), so knobs send rounded ints and enums send their option INDEX.
# The 12-scale / 12-key / 16-channel / 8-gate enums exceed the 6-option enum
# widget, so they are index knobs here (the value readout is the index).
# Slot: SHIFT+SCENE-4 / KNOBS+SCENE-4 (see README, "Shadow-mode touchscreen page").
page=4
ctrl_sock=/tmp/maze_seq_ctrl.sock
display_name="MAZE SEQ"
int_values=1
engine_process_name=maze_seq_host
engine_nsmodule_path=/media/662522/AddOns/ForceMazeSeq/NSMODULE.json
engine_dirname=ForceMazeSeq
engine_arguments_json=[{"NAME":"module-dir flag","VALUE":"--module-dir"},{"NAME":"module directory (also where maze_seq.bin state persists)","VALUE":"/media/662522/AddOns/ForceMazeSeq"},{"NAME":"ctrl-sock flag","VALUE":"--ctrl-sock"},{"NAME":"control socket path","VALUE":"/tmp/maze_seq_ctrl.sock"},{"NAME":"control-channel flag","VALUE":"--control-channel"},{"NAME":"CC control channel (1-16)","VALUE":"1"}]

[tab SEQUENCERS]
