# force-maze (Maze Voice) shadow-mode page -- ported from the original
# compile-time build_maze_voice_tab() (src/force_shadow.c) to prove the
# data-driven page loader against a real, already-live-tested page, not
# just a minimal new one. See DESIGN.md ("Live load test #22") and
# docs/adding-a-page.md.
#
# Every position/range value below was captured directly from the real
# C layout code's own computed output (a temporary debug dump, not
# hand-derived arithmetic), so this is a byte-for-byte port, not a
# redesign.
page=3
ctrl_sock=/tmp/maze_ctrl.sock
display_name="MAZE VOICE"
engine_process_name=maze_host
engine_nsmodule_path=/media/662522/AddOns/ForceMazeVoice/NSMODULE.json
engine_dirname=ForceMazeVoice
engine_arguments_json=[{"NAME":"module-dir flag","VALUE":"--module-dir"},{"NAME":"module directory (chain_params/ui_hierarchy source)","VALUE":"/media/662522/AddOns/ForceMazeVoice"},{"NAME":"ctrl-sock flag","VALUE":"--ctrl-sock"},{"NAME":"control socket path","VALUE":"/tmp/maze_ctrl.sock"},{"NAME":"control-channel flag","VALUE":"--control-channel"},{"NAME":"Q-Link control channel (1-16)","VALUE":"1"}]

